<!DOCTYPE html>
<html>
<head>
  <script src="auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Attendance Station</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 15px; text-align: center; background: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; max-width: 400px; margin-left: auto; margin-right: auto; }
    button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; margin-top: 10px; cursor: pointer; }
    input[type="text"], input[type="password"], select { padding: 10px; font-size: 16px; width: 85%; text-align: center; border: 1px solid #ccc; border-radius: 6px; margin-top: 8px; box-sizing: border-box; }
    
    .pass-container { position: relative; width: 85%; margin: 8px auto 0 auto; }
    .pass-container input { width: 100%; padding-right: 40px; margin-top: 0; }
    .toggle-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; width: auto; padding: 0; margin: 0; cursor: pointer; font-size: 18px; }

    .btn-primary { background: #007bff; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-secondary { background: #6c757d; color: white; margin-top: 10px; }
    .status { margin-top: 15px; font-size: 18px; font-weight: bold; min-height: 40px; }
    .log-box { background: #222; color: #00ff66; padding: 10px; border-radius: 8px; font-family: monospace; height: 180px; overflow-y: auto; text-align: left; }
    .admin-badge { background: #e2e3e5; color: #383d41; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    label { font-weight: bold; display: block; margin-top: 10px; text-align: left; margin-left: 7.5%; }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; max-width: 350px; width: 90%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

    /* Frosted Glass Blur Loading Overlay */
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
    .loading-box { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); text-align: center; max-width: 280px; width: 80%; }
    .spinner { width: 48px; height: 48px; border: 5px solid #e0e0e0; border-top: 5px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- 1. ADMIN LOGIN CARD -->
  <div class="card" id="loginCard">
    <h2>🔒 Admin Authentication</h2>
    <p style="color: #666; font-size: 14px;">Setup Class & Login</p>

    <label for="courseSelect">Select Course:</label>
    <select id="courseSelect">
      <option value="OS_lab_att">OS Lab Attendance</option>
      <option value="OS_theory_att">OS Theory Attendance</option>
    </select>

    <label for="dateInput">Class Date:</label>
    <input type="text" id="dateInput" placeholder="DD/MM/YY" />

    <label for="adminID">Admin Credentials:</label>
    <input type="text" id="adminID" placeholder="Admin ID" />
    
    <!-- Password with Eye Toggle -->
    <div class="pass-container">
      <input type="password" id="adminPasscode" placeholder="Password" />
      <button type="button" class="toggle-btn" onclick="togglePassVisibility('adminPasscode', this)">👁️</button>
    </div>

    <button class="btn-primary" onclick="verifyAndStartClass()">Start Class & Go to Scanner</button>
    <div id="loginError" style="color: red; margin-top: 10px; font-weight: bold;"></div>
  </div>

  <!-- 2. MAIN SCANNING DASHBOARD -->
  <div id="mainDashboard" style="display: none;">
    <div style="text-align: right; margin-bottom: 10px; max-width: 400px; margin-left: auto; margin-right: auto;">
      <span class="admin-badge" id="adminBadge">👤 Admin Active</span>
      <button onclick="logoutAdmin()" class="btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px; display: inline-block; margin: 0 0 0 10px;">🔒 Exit</button>
    </div>

    <div class="card" id="scanSection">
      <h2>📡 NFC Attendance Scanner</h2>
      <div id="sessionInfo" style="font-size: 14px; color: #555; margin-bottom: 10px; font-weight: bold;"></div>
      
      <button class="btn-primary" id="nfcBtn" onclick="initNFC()">📡 Tap ID Cards to Scan</button>
      <div class="status" id="statusMsg">Ready to scan...</div>
      <div class="log-box" id="logBox">-- Live Scan Log --<br></div>
      
      <button class="btn-danger" onclick="openEndClassModal()" style="margin-top: 20px;">Mark Absentees ("A") & End Class</button>
    </div>
  </div>

  <!-- 3. CONFIRMATION MODAL -->
  <div class="modal-overlay" id="endClassModal">
    <div class="modal-content">
      <h3 style="margin-top: 0;">🔒 Confirm Password</h3>
      <p style="font-size: 13px; color: #555;">Enter Admin Password to mark absentees ("A") and finish class:</p>
      
      <div class="pass-container" style="width: 100%;">
        <input type="password" id="endClassPasscode" placeholder="Enter Password" />
        <button type="button" class="toggle-btn" onclick="togglePassVisibility('endClassPasscode', this)">👁️</button>
      </div>

      <div id="modalError" style="color: red; font-size: 13px; margin-top: 8px; font-weight: bold;"></div>
      <button class="btn-danger" onclick="confirmAndEndClass()">Confirm & End Class</button>
      <button class="btn-secondary" onclick="closeEndClassModal()" style="width: 100%;">Cancel</button>
    </div>
  </div>

  <!-- 4. BLUR LOADING OVERLAY -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <div id="loadingText" style="font-weight: bold; color: #333; font-size: 15px;">Processing...</div>
    </div>
  </div>

  <!-- SCRIPT HELPERS -->
  <script>
    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.innerText = "🙈";
      } else {
        input.type = "password";
        btn.innerText = "👁️";
      }
    }

    function showLoading(message) {
      const overlay = document.getElementById("loadingOverlay");
      const text = document.getElementById("loadingText");
      if (text) text.innerText = message || "Processing...";
      if (overlay) overlay.style.display = "flex";
    }

    function hideLoading() {
      const overlay = document.getElementById("loadingOverlay");
      if (overlay) overlay.style.display = "none";
    }
  </script>

  <!-- MAIN APP LOGIC -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzBer4WPhMImkWOLsNmpA0YYfs_47loR9MLhpePRmzjDkyt3XDGWjyIkQaSlp39ahLS/exec";

    var activeDate = "";
    var activeCourse = "OS_lab_att";

    function sendRequest(params) {
      return new Promise((resolve) => {
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        var resolved = false;

        window[callbackName] = function(data) {
          if (!resolved) {
            resolved = true;
            delete window[callbackName];
            if (document.body.contains(script)) document.body.removeChild(script);
            resolve(data || { status: "SUCCESS" });
          }
        };

        params.callback = callbackName;
        params.sheetName = activeCourse || "OS_lab_att";
        params._nc = Date.now();
        const query = new URLSearchParams(params).toString();
        const fullUrl = `${API_URL}?${query}`;

        const script = document.createElement('script');
        script.src = fullUrl;

        script.onerror = function() {
          if (!resolved) {
            delete window[callbackName];
            if (document.body.contains(script)) document.body.removeChild(script);

            const img = new Image();
            img.src = fullUrl;
            
            setTimeout(() => {
              if (!resolved) {
                resolved = true;
                resolve({ status: "SUCCESS", fallback: true });
              }
            }, 800);
          }
        };

        document.body.appendChild(script);

        setTimeout(() => {
          if (!resolved) {
            resolved = true;
            delete window[callbackName];
            if (document.body.contains(script)) document.body.removeChild(script);
            resolve({ status: "SUCCESS", fallback: true });
          }
        }, 3000);
      });
    }

    async function initNFC() {
      if (!('NDEFReader' in window)) {
        alert("Web NFC is only supported on mobile browsers (Chrome/Edge on Android).\nOn PC, you can test UI controls.");
        return;
      }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        document.getElementById('nfcBtn').innerText = "🟢 Scanning Active...";
        document.getElementById('nfcBtn').style.background = "#28a745";

        ndef.addEventListener("reading", async ({ serialNumber }) => {
          logToBox(`Scanned UID: ${serialNumber}`);
          
          document.getElementById('statusMsg').innerText = `⏳ Processing UID: ${serialNumber}...`;
          document.getElementById('statusMsg').style.color = "#007bff";

          await sendRequest({ action: "markPresent", uid: serialNumber, dateStr: activeDate });
          
          document.getElementById('statusMsg').innerText = `✅ Attendance Sent for UID: ${serialNumber}`;
          document.getElementById('statusMsg').style.color = "green";
          logToBox(`--> Attendance "P" updated in Sheet (${activeCourse}) for: ${serialNumber}`);
        });

      } catch (error) {
        alert("NFC Initialization Error: " + error);
      }
    }

    function logToBox(msg) {
      var box = document.getElementById('logBox');
      box.innerHTML += msg + "<br>";
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
