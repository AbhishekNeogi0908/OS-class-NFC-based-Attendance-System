<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Attendance Station</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 15px; text-align: center; background: #f4f6f9; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
    button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; margin-top: 10px; cursor: pointer; }
    .btn-primary { background: #007bff; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .status { margin-top: 15px; font-size: 18px; font-weight: bold; min-height: 40px; }
    .log-box { background: #222; color: #00ff66; padding: 10px; border-radius: 8px; font-family: monospace; height: 180px; overflow-y: auto; text-align: left; }
  </style>
</head>
<body>

  <div class="card">
    <h2>NFC Attendance Station</h2>
    <label><b>Class Date:</b></label>
    <input type="text" id="dateInput" style="padding: 8px; font-size: 16px; width: 60%; text-align: center;" />
    <button class="btn-primary" id="startBtn" onclick="startClass()">Start Class (Create Column)</button>
    <div id="initStatus" style="margin-top:10px; color:#555;"></div>
  </div>

  <div class="card" id="scanSection" style="display:none;">
    <button class="btn-primary" id="nfcBtn" onclick="initNFC()">📡 Tap ID Cards to Scan</button>
    <div class="status" id="statusMsg">Ready to scan...</div>
    <div class="log-box" id="logBox">-- Live Scan Log --<br></div>
    <button class="btn-danger" onclick="finishClass()" style="margin-top: 20px;">Mark Absentees ("A") & End Class</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzBer4WPhMImkWOLsNmpA0YYfs_47loR9MLhpePRmzjDkyt3XDGWjyIkQaSlp39ahLS/exec";

    // Pre-fill today's date (DD/MM/YY)
    var today = new Date();
    var dd = String(today.getDate()).padStart(2, '0');
    var mm = String(today.getMonth() + 1).padStart(2, '0');
    var yy = String(today.getFullYear()).slice(-2);
    document.getElementById('dateInput').value = `${dd}/${mm}/${yy}`;

    var activeDate = "";

    // Form-based background submit (bypasses browser XHR/fetch/CORS security blocks completely)
    function sendRequest(params) {
      return new Promise((resolve) => {
        const iframeName = 'hidden_iframe_' + Math.round(100000 * Math.random());
        const iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        const form = document.createElement('form');
        form.target = iframeName;
        form.action = API_URL;
        form.method = 'GET';
        form.style.display = 'none';

        for (const key in params) {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = params[key];
          form.appendChild(input);
        }

        document.body.appendChild(form);
        form.submit();

        setTimeout(() => {
          if (document.body.contains(form)) document.body.removeChild(form);
          if (document.body.contains(iframe)) document.body.removeChild(iframe);
          resolve({ status: "SUCCESS" });
        }, 1200);
      });
    }

    async function startClass() {
      activeDate = document.getElementById('dateInput').value.trim();
      if (!activeDate) return alert("Please enter a valid date");
      
      var status = document.getElementById('initStatus');
      status.innerText = "Creating column in Sheet...";

      try {
        await sendRequest({ action: "createColumn", dateStr: activeDate });
        document.getElementById('scanSection').style.display = 'block';
        document.getElementById('statusMsg').innerText = `Class active for ${activeDate}! Start scanning.`;
        status.innerText = "Class initialized successfully!";
      } catch (e) {
        alert("API Error: " + e.message);
      }
    }

    async function initNFC() {
      if (!('NDEFReader' in window)) {
        alert("Web NFC is only supported natively in Chrome on Android!");
        return;
      }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        document.getElementById('nfcBtn').innerText = "🟢 Scanning Active...";
        document.getElementById('nfcBtn').style.background = "#28a745";

        ndef.addEventListener("reading", async ({ serialNumber }) => {
          logToBox(`Scanned UID: ${serialNumber}`);
          
          try {
            await sendRequest({ action: "markPresent", uid: serialNumber, dateStr: activeDate });
            document.getElementById('statusMsg').innerText = `✅ Card Processed: ${serialNumber}`;
            document.getElementById('statusMsg').style.color = "green";
            logToBox(`--> Present marked for UID: ${serialNumber}`);
          } catch(e) {
            logToBox(`--> Error marking attendance: ${e.message}`);
          }
        });

      } catch (error) {
        alert("NFC Initialization Error: " + error);
      }
    }

    async function finishClass() {
      if (!confirm(`Mark all remaining empty cells for ${activeDate} as "A"?`)) return;

      document.getElementById('statusMsg').innerText = "Marking absentees...";
      try {
        await sendRequest({ action: "markAbsentees", dateStr: activeDate });
        alert(`Finished marking absentees for ${activeDate}!`);
        document.getElementById('statusMsg').innerText = "Class ended.";
      } catch(e) {
        alert("Error: " + e.message);
      }
    }

    function logToBox(msg) {
      var box = document.getElementById('logBox');
      box.innerHTML += msg + "<br>";
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
